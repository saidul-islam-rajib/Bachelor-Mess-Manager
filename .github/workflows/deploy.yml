name: Deploy

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: deploy-develop
  cancel-in-progress: false

env:
  NAMESPACE: bachelor-point
  APP: bachelor-point

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm run lint

  deploy:
    name: Blue-green deploy
    needs: quality
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Set image tag
        run: echo "TAG=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_ENV"

      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.SERVER_IP }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Copy source to the server
        run: |
          ssh -i ~/.ssh/id_rsa ubuntu@${{ secrets.SERVER_IP }} 'mkdir -p ~/app'
          tar --exclude=node_modules --exclude=.next --exclude=.git \
              --exclude=terraform --exclude=uploads --exclude='*.tfstate*' \
              -czf - . | ssh -i ~/.ssh/id_rsa ubuntu@${{ secrets.SERVER_IP }} 'tar -xzf - -C ~/app'

      - name: Build image on the server
        run: |
          ssh -i ~/.ssh/id_rsa ubuntu@${{ secrets.SERVER_IP }} \
            "cd ~/app && sudo docker build -t ${APP}:${TAG} . && sudo docker save ${APP}:${TAG} | sudo k3s ctr images import -"

      - name: Apply manifests
        run: |
          ssh -i ~/.ssh/id_rsa ubuntu@${{ secrets.SERVER_IP }} \
            "cd ~/app && sed -i 's|REPLACE_WITH_INGRESS_HOST|${{ secrets.SERVER_IP }}.nip.io|g' k8s/free-tier/ingress.yaml && sudo k3s kubectl apply -k k8s/free-tier/"

      - name: Run database migrations
        run: |
          ssh -i ~/.ssh/id_rsa ubuntu@${{ secrets.SERVER_IP }} bash -s <<'REMOTE'
            set -e
            cd ~/app
            sudo k3s kubectl -n bachelor-point delete job bachelor-point-migrate --ignore-not-found=true
            sed "s|REPLACE_IMAGE|docker.io/library/${TAG_IMAGE}|g" k8s/base/migrate-job.yaml \
              | sudo k3s kubectl apply -f -
            sudo k3s kubectl -n bachelor-point wait --for=condition=complete job/bachelor-point-migrate --timeout=900s
            sudo k3s kubectl -n bachelor-point logs job/bachelor-point-migrate --tail=20
          REMOTE
        env:
          TAG_IMAGE: bachelor-point:${{ github.sha }}

      - name: Blue-green deploy
        run: |
          ssh -i ~/.ssh/id_rsa ubuntu@${{ secrets.SERVER_IP }} \
            "cd ~/app && chmod +x scripts/blue-green.sh && sudo KUBECTL='k3s kubectl' NAMESPACE=${NAMESPACE} APP=${APP} ./scripts/blue-green.sh deploy docker.io/library/${APP}:${TAG}"

      - name: Verify live site
        run: |
          curl -fsS --max-time 20 --retry 5 --retry-delay 5 \
            "http://${{ secrets.SERVER_IP }}.nip.io/api/health"

      - name: Free memory on the idle colour
        run: |
          ssh -i ~/.ssh/id_rsa ubuntu@${{ secrets.SERVER_IP }} \
            "cd ~/app && sudo KUBECTL='k3s kubectl' ./scripts/blue-green.sh scale-down-idle"

      - name: Roll back on failure
        if: failure()
        run: |
          ssh -i ~/.ssh/id_rsa ubuntu@${{ secrets.SERVER_IP }} \
            "cd ~/app && sudo KUBECTL='k3s kubectl' ./scripts/blue-green.sh rollback" || true
