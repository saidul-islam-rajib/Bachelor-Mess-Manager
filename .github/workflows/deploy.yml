name: Deploy

on:
  push:
    branches:
      - develop
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, bachelor-point]
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Deploy
        run: |
          chmod +x scripts/deploy.sh scripts/blue-green.sh
          ./scripts/deploy.sh

      - name: Report result
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "Deployed ${{ github.sha }} to the live site."
          else
            echo "Deploy failed. Roll back with: ./scripts/deploy.sh --rollback"
          fi
