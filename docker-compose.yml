name: bachelor-point

services:
  db:
    image: postgres:16-alpine
    container_name: bachelor-point-db
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-bpadmin}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-Local_Dev_Password_123}"
      POSTGRES_DB: "${POSTGRES_DB:-bachelor_point}"
    ports:
      - "${DB_PORT:-5432}:5432"
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -h 127.0.0.1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  migrate:
    build:
      context: .
      target: builder
    container_name: bachelor-point-migrate
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-bpadmin}:${POSTGRES_PASSWORD:-Local_Dev_Password_123}@db:5432/${POSTGRES_DB:-bachelor_point}?schema=public"
      ADMIN_EMAIL: "${ADMIN_EMAIL:-admin@bachelorpoint.local}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-ChangeThisAdminPassword2026}"
      ADMIN_NAME: "${ADMIN_NAME:-System Administrator}"
    command: >
      sh -c "npx prisma migrate deploy &&
             node scripts/sync-roles.js &&
             node scripts/init-admin.js"
    depends_on:
      db:
        condition: service_healthy

  app:
    build:
      context: .
      target: runner
    container_name: bachelor-point-app
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-bpadmin}:${POSTGRES_PASSWORD:-Local_Dev_Password_123}@db:5432/${POSTGRES_DB:-bachelor_point}?schema=public"
      AUTH_SECRET: "${AUTH_SECRET:-local-development-secret-at-least-32-characters-long}"
      ADMIN_EMAIL: "${ADMIN_EMAIL:-admin@bachelorpoint.local}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-ChangeThisAdminPassword2026}"
      UPLOAD_DIR: /data/uploads
      SECURITY_TRUST_PROXY_HEADERS: "false"
      BAZAR_REMINDER_DISPATCH_SECRET: "${BAZAR_REMINDER_DISPATCH_SECRET:-local-dev-bazar-reminder-secret}"
      VAPID_PUBLIC_KEY: "${VAPID_PUBLIC_KEY:-}"
      VAPID_PRIVATE_KEY: "${VAPID_PRIVATE_KEY:-}"
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
      SMTP_FROM: "${SMTP_FROM:-}"
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - uploads-data:/data/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  cron:
    build:
      context: .
      target: runner
    container_name: bachelor-point-cron
    command: ["node", "scripts/cron-loop.js"]
    environment:
      APP_URL: "http://app:8080"
      BAZAR_REMINDER_DISPATCH_SECRET: "${BAZAR_REMINDER_DISPATCH_SECRET:-local-dev-bazar-reminder-secret}"
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
    name: mess_postgres-data
    external: true
  uploads-data:
    name: mess_uploads-data
    external: true
