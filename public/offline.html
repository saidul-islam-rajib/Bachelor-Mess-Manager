<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f172a" />
    <title>Offline · Bachelor Point</title>
    <link rel="icon" href="/icons/favicon-32.png" />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #f8fafc;
        color: #0f172a;
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
      .card {
        width: 100%;
        max-width: 26rem;
        background: #fff;
        border: 1px solid #e2e8f0;
        border-radius: 24px;
        padding: 40px 32px;
        text-align: center;
        box-shadow: 0 1px 3px rgb(15 23 42 / 0.06);
      }
      img {
        height: 56px;
        width: auto;
      }
      h1 {
        margin: 20px 0 8px;
        font-size: 20px;
      }
      p {
        margin: 0;
        color: #475569;
        font-size: 15px;
        line-height: 1.6;
      }
      .note {
        margin-top: 20px;
        padding-top: 20px;
        border-top: 1px solid #f1f5f9;
        font-size: 13px;
        color: #64748b;
      }
      button {
        margin-top: 24px;
        border: 0;
        border-radius: 999px;
        background: #0f172a;
        color: #fff;
        padding: 12px 28px;
        font-size: 15px;
        font-family: inherit;
        cursor: pointer;
      }
      button:hover {
        background: #334155;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="/icons/icon-192.png" alt="Bachelor Point" />
      <h1>You are offline</h1>
      <p>Bachelor Point needs a connection to show meals, bazar and balances.</p>
      <p class="note">
        Money figures are never served from a stale cache, so nothing is shown rather than showing numbers that might
        be out of date.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </div>
    <script>
      window.addEventListener('online', function () {
        location.reload();
      });
    </script>
  </body>
</html>
