apiVersion: v1
kind: Namespace
metadata:
  name: bachelor-point
  labels:
    name: bachelor-point
    app.kubernetes.io/name: bachelor-point
    app.kubernetes.io/managed-by: jenkins
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: bachelor-point-quota
  namespace: bachelor-point
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 8Gi
    limits.cpu: "8"
    limits.memory: 16Gi
    pods: "30"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: bachelor-point-limits
  namespace: bachelor-point
spec:
  limits:
    - type: Container
      default:
        cpu: 500m
        memory: 512Mi
      defaultRequest:
        cpu: 100m
        memory: 256Mi
