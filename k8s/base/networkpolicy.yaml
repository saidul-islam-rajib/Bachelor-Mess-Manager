apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bachelor-point-default-deny
  namespace: bachelor-point
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bachelor-point-allow
  namespace: bachelor-point
spec:
  podSelector:
    matchLabels:
      app: bachelor-point
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 3000
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - ports:
        - protocol: TCP
          port: 1433
    - ports:
        - protocol: TCP
          port: 443
    - ports:
        - protocol: TCP
          port: 2049
