apiVersion: v1
kind: ConfigMap
metadata:
  name: bachelor-point-config
  namespace: bachelor-point
data:
  NODE_ENV: "production"
  PORT: "8080"
  HOSTNAME: "0.0.0.0"

  APP_NAME: "Bachelor Point"
  APP_TAGLINE: "Manage your mess without the arguments."
  APP_CURRENCY_CODE: "BDT"
  APP_CURRENCY_SYMBOL: "৳"
  APP_DATE_LOCALE: "en-GB"
  APP_TIME_ZONE: "UTC"
  APP_AUTHOR_NAME: "Saidul Islam Rajib"
  APP_AUTHOR_EMAIL: "saidul.is.rajib@gmail.com"
  APP_LICENSE: "MIT"

  UPLOAD_DIR: "/data/uploads"

  SECURITY_TRUST_PROXY_HEADERS: "true"

  SESSION_COOKIE_SECURE: "true"

  SEED_ENABLED: "false"

  GROUP_MAX_PER_SUPERVISOR: "10"
  PAGINATION_PAGE_SIZE: "20"
