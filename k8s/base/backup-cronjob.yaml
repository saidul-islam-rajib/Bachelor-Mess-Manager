apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bachelor-point-backups
  namespace: bachelor-point
  labels:
    app: bachelor-point
    component: backup
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: bachelor-point-backup
  namespace: bachelor-point
  labels:
    app: bachelor-point
    component: backup
spec:
  schedule: "30 2 * * *"
  timeZone: "Asia/Dhaka"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app: bachelor-point
            component: backup
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
            fsGroup: 1001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: backup
              image: REPLACE_IMAGE
              command:
                - node
                - scripts/backup-db.js
              env:
                - name: BACKUP_DIR
                  value: /backups
                - name: BACKUP_KEEP_COUNT
                  value: "2"
              envFrom:
                - configMapRef:
                    name: bachelor-point-config
                - secretRef:
                    name: bachelor-point-secrets
              resources:
                requests:
                  cpu: 50m
                  memory: 256Mi
                limits:
                  cpu: 300m
                  memory: 512Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: backups
                  mountPath: /backups
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: bachelor-point-backups
            - name: tmp
              emptyDir: {}
