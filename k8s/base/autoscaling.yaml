apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: bachelor-point-blue
  namespace: bachelor-point
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: bachelor-point-blue
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: bachelor-point-green
  namespace: bachelor-point
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: bachelor-point-green
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: bachelor-point
  namespace: bachelor-point
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: bachelor-point
