apiVersion: batch/v1
kind: Job
metadata:
  name: bachelor-point-seed
  namespace: bachelor-point
  labels:
    app: bachelor-point
    component: seed
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: bachelor-point
        component: seed
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: seed
          image: REPLACE_IMAGE
          imagePullPolicy: Never
          command: ["node", "prisma/seed.js"]
          envFrom:
            - configMapRef:
                name: bachelor-point-config
            - secretRef:
                name: bachelor-point-secrets
          env:
            - name: SEED_ENABLED
              value: "true"
            - name: SEED_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bachelor-point-secrets
                  key: SEED_PASSWORD
                  optional: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 900m
              memory: 640Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
