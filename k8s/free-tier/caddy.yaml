apiVersion: v1
kind: ConfigMap
metadata:
  name: caddy-config
  namespace: bachelor-point
data:
  Caddyfile: |
    {
      email saidul.is.rajib@gmail.com
      admin off
    }

    bachelor-point.team-sober.com {
      encode gzip
      @preview header Cookie *bp_preview=1*
      reverse_proxy @preview bachelor-point-preview:80 {
        header_up X-Forwarded-Proto {scheme}
        header_up X-Forwarded-For {remote_host}
      }
      reverse_proxy bachelor-point-active:80 {
        header_up X-Forwarded-Proto {scheme}
        header_up X-Forwarded-For {remote_host}
      }
    }

    :80 {
      @preview header Cookie *bp_preview=1*
      reverse_proxy @preview bachelor-point-preview:80 {
        header_up X-Forwarded-Proto http
        header_up X-Forwarded-For {remote_host}
      }
      reverse_proxy bachelor-point-active:80 {
        header_up X-Forwarded-Proto http
        header_up X-Forwarded-For {remote_host}
      }
    }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: caddy-data
  namespace: bachelor-point
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 512Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: caddy
  namespace: bachelor-point
  labels:
    app: caddy
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: caddy
  template:
    metadata:
      labels:
        app: caddy
      annotations:
        caddy-config-hash: v1
    spec:
      containers:
        - name: caddy
          image: caddy:2.8-alpine
          ports:
            - name: http
              containerPort: 80
              hostPort: 80
            - name: https
              containerPort: 443
              hostPort: 443
          resources:
            requests:
              cpu: 20m
              memory: 48Mi
            limits:
              cpu: 300m
              memory: 160Mi
          livenessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 30
          volumeMounts:
            - name: config
              mountPath: /etc/caddy
            - name: data
              mountPath: /data
      volumes:
        - name: config
          configMap:
            name: caddy-config
        - name: data
          persistentVolumeClaim:
            claimName: caddy-data
      terminationGracePeriodSeconds: 20
