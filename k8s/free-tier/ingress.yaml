apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bachelor-point
  namespace: bachelor-point
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: REPLACE_WITH_INGRESS_HOST
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: bachelor-point-active
                port:
                  number: 80
