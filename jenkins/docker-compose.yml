services:
  jenkins:
    build:
      context: .
    container_name: bachelor-point-jenkins
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "50000:50000"
    environment:
      JENKINS_ADMIN_ID: "${JENKINS_ADMIN_ID:-admin}"
      JENKINS_ADMIN_PASSWORD: "${JENKINS_ADMIN_PASSWORD:?set JENKINS_ADMIN_PASSWORD in jenkins/.env}"
      SSH_PRIVATE_KEY: "${SSH_PRIVATE_KEY:?set SSH_PRIVATE_KEY in jenkins/.env}"
      SERVER_IP: "${SERVER_IP:?set SERVER_IP in jenkins/.env}"
      GIT_REPO_URL: "${GIT_REPO_URL:-https://github.com/saidul-islam-rajib/Bachelor-Mess-Manager.git}"
    volumes:
      - jenkins-home:/var/jenkins_home
      - ./jenkins.yaml:/var/jenkins_conf/jenkins.yaml:ro

volumes:
  jenkins-home:
